name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: brew install libusb
      - run: swift build --build-tests
      - run: swift test --skip-build
      - run: EHDR_SKIP_BUILD=1 ./build.sh debug
